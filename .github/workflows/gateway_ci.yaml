name: Gateway CI

on:
  push:
    branches:
      - stage
      - main

  pull_request:
    branches:
      - stage
      - main

  workflow_dispatch: # button on GitHub Actions to trigger the workflow manually

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/newtonperazzo/weather-gateway

jobs:
  validate-python:
    name: Validate Python
    runs-on: ubuntu-latest # temporary linux machine to run the job

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check Python compilation
        run: python -m compileall app config

      - name: Run tests
        env:
          AUTH_SERVICE_URL: https://fastapi-authentication-vi24.onrender.com
          WEATHER_SERVICE_URL: https://weather-analysis-0qr8.onrender.com
          IMAGE_NAME: ghcr.io/newtonperazzo/weather-gateway
        run: python -m pytest tests

  build-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: validate-python

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build --tag weather-gateway:${{ github.sha }} .
  
  publish-production:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs:
      - validate-python
      - build-image

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate in GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  publish-stage:
    name: Publish stage image
    runs-on: ubuntu-latest
    needs:
      - validate-python
      - build-image

    if: github.event_name == 'push' && github.ref == 'refs/heads/stage'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate in GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish stage image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
              ${{ env.IMAGE_NAME }}:stage
              ${{ env.IMAGE_NAME }}:stage-${{ github.sha }}
